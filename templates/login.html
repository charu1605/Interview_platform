<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recruiter Login | AI Interviewer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg,#4facfe,#00f2fe);
}

/* Card */

.auth-card{
width:380px;
padding:40px;
border-radius:18px;
background:rgba(255,255,255,0.15);
backdrop-filter: blur(15px);
box-shadow:0 15px 35px rgba(0,0,0,0.2);
text-align:center;
color:white;
animation:fadeIn 0.8s ease;
}

/* Heading */

h2{
font-weight:600;
margin-bottom:8px;
}

p{
font-size:0.9rem;
margin-bottom:25px;
opacity:0.9;
}

/* Input Fields */

.input-group{
position:relative;
margin-bottom:18px;
}

.input-group input{
width:100%;
padding:12px 40px 12px 12px;
border:none;
border-radius:8px;
outline:none;
font-size:0.95rem;
}

.input-group span{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
opacity:0.6;
}

/* Button */

button{
width:100%;
padding:13px;
border:none;
border-radius:8px;
background:linear-gradient(135deg,#27ae60,#2ecc71);
color:white;
font-weight:500;
font-size:1rem;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

/* Bottom Text */

.switch{
margin-top:18px;
font-size:0.85rem;
}

.switch a{
color:#fff;
font-weight:600;
text-decoration:underline;
}

/* Animation */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="auth-card">

<h2>Recruiter Login</h2>
<p>Access your AI Interview Dashboard</p>

<form action="/login" method="POST">

<div class="input-group">
<input type="email" name="email" placeholder="Email Address" required>
<span>📧</span>
</div>

<div class="input-group">
<input type="password" name="password" placeholder="Password" required>
<span>🔒</span>
</div>

<button type="submit">Login to Dashboard</button>

</form>

<div class="switch">
New here? <a href="/signup">Create an account</a>
</div>

</div>

</body>
</html>
